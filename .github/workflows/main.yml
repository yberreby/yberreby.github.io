# Builds the site with Zola and deploys it to the gh-pages branch.
# The action's version is the Zola version; keep it equal to the local one (see CLAUDE.md).
on: push
name: Build and deploy GH Pages
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' && github.repository == 'yberreby/yberreby.github.io'
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build_and_deploy
        uses: shalzz/zola-deploy-action@v0.23.6
        env:
          PAGES_BRANCH: gh-pages
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
